# Omni-Weather: RadarQA understanding-only config

vlm_sft:
  dataset_names:
  - radar_img_brief
  - radar_img_detail
  - radar_seq_brief
  - radar_seq_detail
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  frame_sampler_args:
    max_num_frames: 12
    min_num_frames: 8
  is_mandatory: true
  shuffle_lines: True
  shuffle_seed: 0
  num_used_data:
  - 20000     # radar_img_brief
  - 14500     # radar_img_detail
  - 20000     # radar_seq_brief
  - 14500     # radar_seq_detail
  weight: 1
